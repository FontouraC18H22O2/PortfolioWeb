<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- O tipo tem de corresponder ao ficheiro: IconHD.png é PNG, não SVG -->
    <link rel="icon" type="image/png" href="/IconHD.png" />
    <link rel="apple-touch-icon" href="/IconHD.png" />

    <title>Hugo Dias | Portefólio</title>
    <meta
      name="description"
      content="Portefólio de Hugo Dias, estudante de Engenharia Informática no ISPGAYA. Projetos full-stack em React, Python, Kotlin e Java."
    />
    <meta name="author" content="Hugo Dias" />
    <link rel="canonical" href="https://portfolio-web-one-hazel.vercel.app/" />

    <!-- Cor da barra do browser em mobile, a condizer com o fundo -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Pré-visualização ao partilhar no LinkedIn, WhatsApp, Discord, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hugo Dias" />
    <meta property="og:title" content="Hugo Dias | Portefólio" />
    <meta
      property="og:description"
      content="Estudante de Engenharia Informática. Projetos full-stack em React, Python, Kotlin e Java."
    />
    <meta property="og:url" content="https://portfolio-web-one-hazel.vercel.app/" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:locale:alternate" content="en_GB" />
    <!-- Cria uma imagem 1200x630 e guarda-a em public/og-image.png -->
    <meta property="og:image" content="https://portfolio-web-one-hazel.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portefólio de Hugo Dias" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hugo Dias | Portefólio" />
    <meta
      name="twitter:description"
      content="Estudante de Engenharia Informática. Projetos full-stack em React, Python, Kotlin e Java."
    />
    <meta name="twitter:image" content="https://portfolio-web-one-hazel.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
